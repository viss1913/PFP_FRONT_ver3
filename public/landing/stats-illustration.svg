<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a3d2a"/>
      <stop offset="1" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5c84a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="480" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="400" cy="80" r="120" fill="#c9a227" opacity="0.08"/>
  <circle cx="60" cy="320" r="90" fill="#c9a227" opacity="0.06"/>

  <!-- Abstract family office building -->
  <rect x="140" y="120" width="200" height="160" rx="12" fill="#122e1f" stroke="url(#gold)" stroke-width="1.5" opacity="0.9"/>
  <rect x="160" y="145" width="50" height="40" rx="6" fill="#1e4530"/>
  <rect x="220" y="145" width="50" height="40" rx="6" fill="#1e4530"/>
  <rect x="280" y="145" width="40" height="40" rx="6" fill="#1e4530"/>
  <rect x="170" y="200" width="140" height="8" rx="4" fill="#2d5a40"/>
  <rect x="170" y="220" width="100" height="8" rx="4" fill="#2d5a40"/>
  <rect x="170" y="240" width="120" height="8" rx="4" fill="#2d5a40"/>

  <!-- Rising chart -->
  <path d="M80 280 L140 220 L200 250 L260 180 L320 200 L380 120" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="140" cy="220" r="6" fill="#c9a227"/>
  <circle cx="260" cy="180" r="6" fill="#c9a227"/>
  <circle cx="380" cy="120" r="8" fill="#e5c84a"/>

  <!-- Shield / protection -->
  <path d="M240 60 L280 75 V115 C280 145 240 165 240 165 C240 165 200 145 200 115 V75 Z" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>

  <text x="240" y="360" text-anchor="middle" fill="#c9a227" font-family="Georgia, serif" font-size="14" opacity="0.8">Family capital · One office</text>
</svg>
